version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: rpg-redis
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data
    networks:
      - rpg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru

  rpg-api:
    image: ghcr.io/kirkdiggler/rpg-api:latest
    container_name: rpg-api
    restart: unless-stopped
    expose:
      - "50051"
    environment:
      - PORT=50051
      - LOG_LEVEL=info
      - ENV=production
      - REDIS_ADDR=redis:6379
      # Default dungeon becomes the Kirk-authored reference-tomb content
      # (rpg-api#709/#716) instead of the legacy hardcoded crypt -- a no-op
      # until an rpg-api image embedding reference-tomb.yaml is actually
      # running (validated at orchestrator construction: an rpg-api image
      # that doesn't recognize this key fails startup loudly, so this can
      # only ever be live alongside a compatible image). Instant rollback:
      # remove this line and redeploy.
      - RPG_DUNGEON_KEY=reference-tomb
      # Dungeon Builder authoring surface (rpg-project#169: "remote phase =
      # flip env gate in deployed compose"). NOTE: PR #67 put these on
      # docker-compose.api.yml, which the production pipeline never reads --
      # deploy.yml runs docker-compose.prod.yml, this file. The gate REQUIRES
      # RPG_CONTENT_DIR at construction; PutDungeon writes through to files
      # there, so it must be a bind mount that survives the pipeline's
      # down/up cycle (untracked paths survive its `git reset --hard`).
      # Instant rollback: remove these two lines + the volume and redeploy.
      - RPG_AUTHORING_ENABLED=1
      - RPG_CONTENT_DIR=/content
    volumes:
      # Authored dungeon YAMLs (write-through persistence). Empty dir is
      # valid -- embedded dungeons always exist; authored ones accumulate.
      - ./content:/content
    depends_on:
      - redis
    networks:
      - rpg-network
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "nc -z localhost 50051 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    container_name: rpg-envoy
    restart: unless-stopped
    expose:
      - "8080"
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - rpg-api
    networks:
      - rpg-network
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml -l info

  discord-auth:
    build:
      context: ./services/discord-auth
      dockerfile: Dockerfile
    container_name: rpg-discord-auth
    restart: unless-stopped
    expose:
      - "8080"
    environment:
      - PORT=8080
      - DISCORD_CLIENT_ID=${DISCORD_CLIENT_ID}
      - DISCORD_CLIENT_SECRET=${DISCORD_CLIENT_SECRET}
      - DISCORD_REDIRECT_URI=${DISCORD_REDIRECT_URI}
    networks:
      - rpg-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  rpg-web:
    image: ghcr.io/kirkdiggler/rpg-dnd5e-web:latest
    container_name: rpg-web
    restart: unless-stopped
    expose:
      - "80"
    environment:
      - VITE_DISCORD_CLIENT_ID=${VITE_DISCORD_CLIENT_ID}
      - VITE_API_BASE_URL=/api
    depends_on:
      - rpg-api
      - envoy
    networks:
      - rpg-network

  nginx:
    build:
      context: .
      dockerfile: ./nginx/Dockerfile
    container_name: rpg-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - certbot-conf:/etc/letsencrypt:rw
      - certbot-www:/var/www/certbot:rw
    environment:
      - DOMAIN_NAME=${DOMAIN_NAME}
      - EMAIL=${EMAIL}
      - SSL_MODE=${SSL_MODE:-ssl}
    depends_on:
      - rpg-api
      - rpg-web
      - envoy
      - discord-auth
    networks:
      - rpg-network

networks:
  rpg-network:
    driver: bridge

volumes:
  redis_data:
  certbot-conf:
  certbot-www: