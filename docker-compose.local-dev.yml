version: '3.8'

services:
  redis:
    image: redis:7-alpine
    networks:
      - rpg-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

  dnd-database:
    image: ghcr.io/5e-bits/5e-database:latest
    networks:
      - rpg-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 3

  dnd-api:
    image: ghcr.io/5e-bits/5e-srd-api:4.2.1
    environment:
      - NODE_ENV=production
      - MONGODB_URI=mongodb://dnd-database:27017/5e-database
      - REDIS_URL=redis://redis:6379
      - RATE_LIMIT_WINDOW_MS=1000
      - RATE_LIMIT_MAX=1000
    depends_on:
      - dnd-database
      - redis
    networks:
      - rpg-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api"]
      interval: 10s
      timeout: 5s
      retries: 3

  rpg-api:
    # `dev` is the integration branch image, published by rpg-api's docker
    # workflow on every push to `dev`. Override RPG_API_IMAGE_TAG to pin a
    # different tag (e.g. `latest` for what's in production, or a sha).
    image: ghcr.io/kirkdiggler/rpg-api:${RPG_API_IMAGE_TAG:-dev}
    expose:
      - "50051"  # Only expose internally to Docker network
    environment:
      - PORT=50051
      - LOG_LEVEL=info
      - REDIS_ADDR=redis:6379
      - AUTH_DEV_MODE=true
      - DND5E_API_URL=http://dnd-api:3000/api/2014/
      # Dungeon Builder authoring surface, same shape as production
      # (docker-compose.prod.yml): without RPG_AUTHORING_ENABLED=1 the
      # AuthoringService never registers, so the builder's 3D preview,
      # validation, and Save & Play all fail with Unimplemented on a
      # stock local stack. The gate REQUIRES RPG_CONTENT_DIR at
      # construction; PutDungeon writes through to files there.
      - RPG_AUTHORING_ENABLED=1
      - RPG_CONTENT_DIR=/content
    volumes:
      # Authored dungeon YAMLs (write-through persistence for PutDungeon).
      # Empty dir is valid — the api seeds reference content on boot
      # (rpg-api#822); authored ones accumulate here across restarts.
      # Shared by all isolated local env projects on purpose: dungeons are
      # authored data, not per-env runtime state.
      - ./content:/content
    depends_on:
      - redis
      - dnd-api
    networks:
      - rpg-network
    healthcheck:
      test: ["CMD", "/bin/sh", "-c", "nc -z localhost 50051 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  envoy:
    image: envoyproxy/envoy:v1.31-latest
    ports:
      - "${RPG_API_HOST_PORT:-8080}:8080"  # host-accessible for the web dev-server's /connect proxy
    expose:
      - "9901"  # Admin interface only internal
    volumes:
      - ./envoy/envoy.yaml:/etc/envoy/envoy.yaml:ro
    depends_on:
      - rpg-api
    networks:
      - rpg-network
    command: /usr/local/bin/envoy -c /etc/envoy/envoy.yaml -l info

  # Simple nginx for local dev without the web container
  nginx-local:
    image: nginx:alpine
    volumes:
      - ./nginx/nginx-local.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - envoy
    networks:
      - rpg-network

networks:
  rpg-network:
    driver: bridge